name: Recover Windows QA publication artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c905de7a58d22ae5eff0e11cc34ef703e885998b
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install exact Sass version
        run: |
          mkdir -p "$RUNNER_TEMP/sass"
          curl -fL --retry 3 https://github.com/sass/dart-sass/releases/download/1.105.0/dart-sass-1.105.0-linux-x64.tar.gz | tar -xz -C "$RUNNER_TEMP/sass"
          echo "$RUNNER_TEMP/sass/dart-sass" >> "$GITHUB_PATH"
          echo "HUGO_CACHEDIR=$RUNNER_TEMP/hugo-cache" >> "$GITHUB_ENV"
      - name: Repeat only the shard whose portable ZIP upload failed
        run: |
          python - <<'PY'
          import os,sys,subprocess,runpy
          os.environ['GITHUB_SHA']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          sys.argv=['qa-batch-build.py','1','16']
          runpy.run_path('qa-batch-build.py',run_name='__main__')
          PY
      - name: Preserve generated colon filenames inside Linux TAR
        run: tar -cf qa-public-1.tar -C qa-public .
      - uses: actions/upload-artifact@v6
        with:
          name: qa-results-recovery-1
          path: qa-output
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        with:
          name: qa-public-1-tar
          path: qa-public-1.tar
