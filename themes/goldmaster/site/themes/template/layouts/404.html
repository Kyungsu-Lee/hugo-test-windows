<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="{{ "css/styles.css" | relURL }}">
</head>
<body>
    <div class="notfound-container" style="text-align:center; margin-top:5em;">
        <h1>Page Not Found</h1>
        <p>Sorry, the page you are looking for does not exist.</p>
        <p>You can
            <a href="javascript:history.back()">go back a page</a> or
            <a href="{{ "/" | relURL }}">go home</a> or try
            <a id="archive-link" href="#" target="_blank">Archive.org</a>
        </p>
    </div>
    <script>
        // Set the Archive.org link to the current URL
        document.getElementById('archive-link').href =
            'https://web.archive.org/web/*/' + window.location.href;
    </script>
</body>
</html>
