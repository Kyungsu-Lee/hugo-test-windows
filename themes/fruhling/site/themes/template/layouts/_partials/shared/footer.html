<footer class="web-footer footer bg-color-white">
    <div class="footer-widgets pt-75px pb-30px">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 m30px">
                    <div class="footer-widget">
                        {{- $footer := .Site.GetPage "/footer" -}}
                        {{- if not $footer -}}
                            {{- range hugo.Sites -}}
                                {{- if eq .Language.Lang "en" -}}
                                    {{- $footer = .GetPage "/footer" -}}
                                {{- end -}}
                            {{- end -}}
                        {{- end -}}
                        {{- with $footer }}
                            {{ .Content }}
                        {{- end }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</footer>
