# Example site configuration for the Blank Magazine theme.
# Run it from the repository root with:
#   hugo server --source exampleSite --themesDir ../..
baseURL = "https://example.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
title = "Sherlock Lau"

enableRobotsTXT = true

[pagination]
  pagerSize = 9

[params]
  description = "写作者 / 摄影爱好者 / 永远的学习者。记录生活、阅读与行走。"
  author = "Sherlock Lau"
  authorBio = "写作者 / 摄影爱好者 / 永远的学习者"
  slogan = "把平凡的日子，写成值得重读的文字"
  email = "hello@example.com"
  instagram = "https://instagram.com/"
  twitter = "https://twitter.com/"
  facebook = "https://facebook.com/"
  pinterest = "https://pinterest.com/"
  mainSections = ["posts"]

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    name = "相册"
    url = "/gallery/"
    weight = 4
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 5
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 6

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
