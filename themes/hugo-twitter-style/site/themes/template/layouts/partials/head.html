<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} / {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify }}{{ else }}{{ .Site.Params.bio | default .Site.Title }}{{ end }}{{ end }}">
    <link rel="stylesheet" href="{{ "css/twitter-style.css" | relURL }}">
    {{ if .Site.Params.enableXDynamic }}
    <script defer src="{{ "js/x-profile.js" | relURL }}"></script>
    {{ end }}
</head>
