{{ define "main" }}
  <article class="article">
    <header class="article-header">
      <h1 class="article-title">{{ .Title }}</h1>
    </header>

    <div class="article-body">
      {{ .Content }}
    </div>

    {{ if .Translations }}
      <footer class="article-footer">
        {{ partial "lang-switch.html" . }}
      </footer>
    {{ end }}
  </article>
{{ end }}
