{{ define "main" }}
  <div class="tags-index">
    <h1 class="tags-index__title">{{ .Title }}</h1>
    <ul class="tags-index__list">
      {{ range .Data.Terms.ByCount }}
        <li>
          <a href="{{ "/tags/" | relLangURL }}{{ .Name | urlize }}/">{{ .Name }}</a>
          <span class="tags-index__count">({{ .Count }})</span>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
