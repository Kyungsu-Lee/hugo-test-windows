{{ define "main" }}
  <div class="home">
    <header class="term-header">
      <div class="term-eyebrow">{{ i18n "tags_label" | default "Tag" }}</div>
      <h1 class="term-name">{{ .Title }}</h1>
      <div class="term-count">{{ len .Pages }}</div>
    </header>

    {{ partial "post-list-by-year.html" .Pages }}
  </div>
{{ end }}
