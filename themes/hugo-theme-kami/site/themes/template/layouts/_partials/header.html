<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav class="site-nav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      {{ partial "theme-toggle.html" . }}
    </nav>
  </div>
</header>
