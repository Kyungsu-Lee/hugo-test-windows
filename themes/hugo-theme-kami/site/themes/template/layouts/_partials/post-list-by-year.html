{{ $posts := . }}
{{ range $posts.GroupByDate "2006" }}
  <section class="year-group">
    <h2 class="year-label">{{ .Key }}</h2>
    <ul class="post-index">
      {{ range .Pages }}
        <li class="post-row">
          <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
          <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
        </li>
      {{ end }}
    </ul>
  </section>
{{ end }}
