baseurl = "https://example.org/"
locale = "en-us"
title = "guest@dev:~$"


[markup.goldmark.renderer]
  unsafe = true

[params]
  prompt = "guest@dev:~$"
  
  [params.dashboard]
    enabled = true
    ascii_art = """
   __                                    
  / /_  __  ______ _____                   
 / __ \\/ / / / __ `/ __ \\                  
/ / / / /_/ / /_/ / /_/ /                  
/_/ /_/\\__,_/\\__, /\\____/                   
            /____/                         
"""
    ascii_color = "#bb9af7"
    title = "Welcome to the Tokyo Terminal Theme"
    subtitle = "A clean, Neovim-inspired TUI dashboard for Hugo."
    hint = "Press the highlighted keys to navigate."
  
  [[params.social]]
    name = "github"
    url = "https://github.com"
  [[params.social]]
    name = "twitter"
    url = "https://twitter.com"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about"
    [menu.main.params]
      shortcut = "a"
      icon = ""
  [[menu.main]]
    identifier = "experience"
    name = "Experience"
    url = "/experience"
    [menu.main.params]
      shortcut = "e"
      icon = ""
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects"
    [menu.main.params]
      shortcut = "p"
      icon = ""
  [[menu.main]]
    identifier = "skills"
    name = "Skills"
    url = "/skills"
    [menu.main.params]
      shortcut = "s"
      icon = ""
