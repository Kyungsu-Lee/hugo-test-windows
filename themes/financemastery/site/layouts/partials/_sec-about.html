{{ $data := index .Site.Data .Site.Language.Lang }}

{{ if $data.homepage.section_about }}
{{ with $data.homepage.section_about }}
<section class="section section_about">
    <div class="container">
        
        <div class="box">
            <h2>{{ .title }}</h2>

            <div class="row_2">
                <div class="box__img">
                    <img src="{{ .img | relURL }}" alt="{{ .title }}" width="600" height="about" class="img--contain">
                </div>
                <div class="box__text">
                    {{ .content | markdownify }}
                </div>
            </div>
        </div>
       
    </div>
</section>
{{ end }}
{{ end }}
