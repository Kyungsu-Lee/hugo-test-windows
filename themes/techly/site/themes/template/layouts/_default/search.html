{{ define "main" }}
  {{- with site.Home.OutputFormats.Get "JSON" -}}
    <link rel="preload" href="{{ .RelPermalink }}" as="fetch" crossorigin="anonymous">
  {{- end -}}

  <header class="blog-header-section">
    <div class="container">
      <h1 class="section-title">{{ .Title }}</h1>
      {{- with .Params.description }}
        <p class="section-subtitle">{{ . }}</p>
      {{- end }}
    </div>
  </header>

  <section class="search-section" aria-label="Search results">
    <div class="container">
      <div class="search-panel">
        {{ partial "search-form.html" (dict "class" "search-form search-form--page" "inputId" "search-input" "placeholder" "Search articles…") }}

        <p id="search-status" class="search-status" aria-live="polite"></p>
        <div id="search-results" class="search-results"></div>
      </div>
    </div>
  </section>
{{ end }}
