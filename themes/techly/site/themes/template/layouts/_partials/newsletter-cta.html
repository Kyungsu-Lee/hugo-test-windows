{{- with site.Params.newsletter }}
  {{- $cta := . }}
  <section class="cta-section" aria-labelledby="cta-heading">
    <div class="container">
      <h2 id="cta-heading">{{ .title | default "Stay up to date" }}</h2>
      {{- with .text }}
        <p>{{ . }}</p>
      {{- end }}
      {{- with .url }}
        <a href="{{ . }}" class="btn btn-primary"{{ if $cta.external }} target="_blank" rel="noopener noreferrer"{{ end }}>
          {{ $cta.label | default "Subscribe now" }}
        </a>
      {{- end }}
    </div>
  </section>
{{- end }}
