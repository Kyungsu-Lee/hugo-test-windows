baseURL = ""
locale = "en"
title = "Shizuka Demo"

paginate = 5

[author]
  name = "Your Name"
  email = "you@example.com"

[params]
  authorName = "Your Name"
  description = "A minimal, clean Hugo blog theme inspired by the Japanese aesthetic of shibui."
  keywords = ["blog", "minimal"]
  ogImage = "/images/og-default.png"
  rssLimit = 20
  dateFormat = "January 2, 2006"
  github = "https://github.com/yourusername"
  website = "https://yourwebsite.com"
  tagline = "Slow writing, clear thinking."
  # Analytics (optional)
  googleAnalyticsID = "G-DEMO123456"  # Your GA4 Measurement ID
  enableCookieConsent = true          # Show GDPR cookie consent banner
  privacyPolicyURL = "/policy/"
  # Comments (optional)
  cusdisAppId = "a49eb5f3-4da8-44b5-bb7b-11cb8f3a0f55"  # Your Cusdis App ID — get it at https://cusdis.com

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    style = "monokailight"
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Archive"
    url = "/archive/"
    weight = 2
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[sitemap]
  changefreq = "weekly"
  priority = 0.5
