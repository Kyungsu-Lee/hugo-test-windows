{{ define "main" }}
  <div class="container{{ if .Params.fullWidth }}-fluid{{ end }}" role="main">
    <div class="row">
      <div class="{{ cond .Params.fullWidth "col-12" "col-md-10 offset-md-1" }}">
        {{ with .Content }}
          <div class="content-section">
            {{.}}
          </div>
        {{ end }}
        {{ partial "publication-list.html" (partial "func/paginate.html" .).Pages }}
      </div>
    </div>
  </div>
{{ end }}
