# Third-party assets. The URL is the CDN link; the hash is its SRI value.
# With selfHosted = true the theme fetches each file at build time, checks it
# against the hash, and serves it from the site. Bump the URL and hash together.

[bootstrap-css]
url = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
integrity = "sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

[bootstrap-js]
url = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
integrity = "sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"

[katex-js]
