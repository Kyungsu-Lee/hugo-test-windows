# nuno — English UI strings.
#
# Copy this file to i18n/<lang>.toml in your own site (or in the theme, as a
# pull request) and translate the values. Keys with `one` and `other` are
# pluralised by Hugo from the `count` passed in; `{{ .count }}` and friends are
# Go template placeholders and must survive translation.
#
# Nothing here is content — post titles, section titles and page headings all
# come from your front matter. These are only the strings the theme itself
# renders.

# --- Chrome: nav, footer, skip link -----------------------------------------

[skipToContent]
other = "Skip to content"

[searchPosts]
other = "Search posts"

[search]
other = "Search"

[switchColourTheme]
other = "Switch colour theme"

# Announced by the theme toggle. The label describes where the button goes,
# not where you are, so it is the opposite of the current mode.
[switchToLight]
other = "Switch to light mode"

[switchToDark]
other = "Switch to dark mode"

[switchToGreen]
other = "Switch to green"

[switchToBrown]
other = "Switch to brown"

[opensInNewTab]
other = "(opens in a new tab)"

# --- Search overlay ---------------------------------------------------------

[searchPlaceholder]
other = "Search"

[searchEsc]
other = "Esc"

[searchCancel]
other = "Cancel"

[searchHintMove]
other = "↑↓ move"

[searchHintOpen]
other = "↵ open"

[searchHintClose]
other = "esc close"

# Rendered as: Nothing yet on <the query>.
[searchEmptyTitle]
other = "Nothing yet on"

[searchEmptyHint]
other = "Try a shorter word, or a different spelling."

[searchBrowseAll]
one = "Browse the one post →"
other = "Browse all {{ .count }} posts →"

# Result count above the list. Rendered by JavaScript, which cannot call i18n, so
# these are handed to it pre-rendered via window.NUNO.i18n — and because Hugo
# cannot pluralise a count it does not yet know, the two forms are separate keys
# and `{n}` is substituted in the browser. Keep the `{n}` literal.
[resultsCountOne]
other = "{n} post"

[resultsCountMany]
other = "{n} posts"

# The /search/ page. `{{ .key }}` is the ⌘K / Ctrl K badge and is HTML.
[searchPageLead]
other = "Search {{ .count }} posts by title, description or tag."

[searchPageHint]
other = "Press {{ .key }} anywhere on the site to open it."

